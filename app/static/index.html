<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaTech · Asistente de documentación</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --accent: #2f5bea; --border: #e3e6ec; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 24px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 12px; font-size: 1rem; border: 1px solid var(--border); border-radius: 8px; }
    button { padding: 12px 18px; font-size: 1rem; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .examples { margin: 12px 0 24px; display: flex; flex-wrap: wrap; gap: 6px; }
    .examples button { background: #e8edfc; color: var(--accent); font-size: .85rem; padding: 6px 10px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
    .answer { font-size: 1.05rem; line-height: 1.5; }
    .no-info { color: #a15c00; }
    .source { border-top: 1px solid var(--border); padding: 10px 0; font-size: .9rem; }
    .source b { color: var(--accent); }
    .source small { color: var(--muted); }
    .source p { margin: 6px 0 0; color: #374151; white-space: pre-line; }
  </style>
</head>
<body>
<main>
  <h1>Asistente de documentación interna</h1>
  <p class="sub">Preguntá sobre políticas, procedimientos o documentación técnica de NovaTech (empresa ficticia).</p>

  <form id="form">
    <input id="question" placeholder="Ej: ¿Cuántos días de vacaciones tengo?" required minlength="3" maxlength="500">
    <button id="send">Preguntar</button>
  </form>

  <div class="examples">
    <button type="button">¿Cuál es el límite de comidas en viajes nacionales?</button>
    <button type="button">¿Qué código devuelve la API si supero el límite de solicitudes?</button>
    <button type="button">¿Puedo usar un pendrive en la notebook?</button>
    <button type="button">¿Cuál es el sueldo del gerente general?</button>
  </div>

  <div id="result"></div>
</main>

<script>
  const form = document.getElementById("form");
  const input = document.getElementById("question");
  const send = document.getElementById("send");
  const result = document.getElementById("result");

  document.querySelectorAll(".examples button").forEach(b =>
    b.addEventListener("click", () => { input.value = b.textContent; form.requestSubmit(); })
  );

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    send.disabled = true;
    result.innerHTML = '<div class="card">Buscando en los documentos...</div>';
    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: input.value })
      });
      if (!res.ok) throw new Error("Error " + res.status);
      const data = await res.json();

      const sources = data.sources.map(s => `
        <div class="source">
          <b>[${s.ref}]</b> ${escapeHtml(s.document)}${s.page ? " · página " + s.page : ""}
          <small> · similitud ${s.score.toFixed(2)}</small>
          <p>${escapeHtml(s.text)}</p>
        </div>`).join("");

      result.innerHTML = `
        <div class="card">
          <div class="answer ${data.has_answer ? "" : "no-info"}">${escapeHtml(data.answer)}</div>
        </div>
        ${data.sources.length ? `<div class="card"><b>Fuentes</b>${sources}</div>` : ""}`;
    } catch (err) {
      result.innerHTML = `<div class="card no-info">No se pudo conectar con la API (${escapeHtml(err.message)}).</div>`;
    } finally {
      send.disabled = false;
    }
  });
</script>
</body>
</html>
